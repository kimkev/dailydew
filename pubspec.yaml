name: dailydew
description: "Easy Water Reminders."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  # Local Storage 
  shared_preferences: ^2.5.5
  # Local Notifications
  flutter_local_notifications: ^22.3.0
  # Icons for iOS style
  cupertino_icons: ^1.0.9
  # timezone 
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  # This is used for legacy icons (Android 7 and below)
  image_path: "assets/icons/app_icon_foreground.png" 
  # These are used for Adaptive Icons (Android 8+)
  adaptive_icon_background: "assets/icons/app_icon_background.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21